name: WanderWise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Root Dependencies
        run: npm ci

      - name: 4. Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: 5. Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: 6. Run Code Linting
        run: npm run lint

      - name: 7. Run Backend Automated Tests
        run: npm run test:server

      - name: 8. Run Frontend Automated Tests
        run: npm run test:client

      - name: 9. Build Client Production Bundle
        run: npm run client:build

  docker-build:
    name: Containerization Check
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Fullstack Docker Image
        run: |
          docker build -t wanderwise:v1.0.0 -f Dockerfile .
          echo "✅ Fullstack Docker image built successfully."

      - name: 4. Build Microservice Docker Images
        run: |
          docker build -t wanderwise-server:v1.0.0 ./server
          docker build -t wanderwise-client:v1.0.0 ./client
          echo "✅ Server and Client microservice images built successfully."

  deploy:
    name: Deploy to Hosting Platform
    needs: [test-and-lint, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Deploy to Render via Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering automated zero-downtime deployment on Render..."
            RESPONSE=$(curl -s -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HTTP_CODE="${RESPONSE: -3}"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Deployment triggered successfully on Render! (HTTP $HTTP_CODE)"
            else
              echo "❌ Render deployment hook failed with HTTP status $HTTP_CODE"
              exit 1
            fi
          else
            echo "ℹ️ Notice: RENDER_DEPLOY_HOOK_URL secret not configured in repository."
            echo "ℹ️ To enable auto-deployment, add RENDER_DEPLOY_HOOK_URL under GitHub Repo Settings -> Secrets."
            echo "ℹ️ All CI checks (Lint, Unit Tests, Production Bundle, Docker Build) have PASSED."
          fi
