services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: wanderwise_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wanderwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-wanderwise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wanderwise} -d ${POSTGRES_DB:-wanderwise}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wanderwise_network

  # Backend REST API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wanderwise_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      DATABASE_URL: postgres://${POSTGRES_USER:-wanderwise}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wanderwise}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wanderwise_network

  # Frontend Web Client Service (Nginx SPA)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: wanderwise_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - wanderwise_network

volumes:
  postgres_data:
    driver: local

networks:
  wanderwise_network:
    driver: bridge
